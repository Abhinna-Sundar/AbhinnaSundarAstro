title: "Be in the Clouds"
intro: >-
  My dissertation asks how metallicity, environment and rotation shape the Be
  phenomenon: rapidly rotating B stars that build a circumstellar decretion disk
  and show Balmer emission. The Small and Large Magellanic Clouds give
  metal-poor comparison samples to the Milky Way.
hero_image: clouds-vlt     # an id from images.yaml, or a path like /images/figures/my-plot.png

